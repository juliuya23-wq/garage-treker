<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Гараж — трекер</title>
<style>
  :root {
    --bg: #0b0b08;
    --card: #16180d;
    --card2: #1e2110;
    --line: #2c3117;
    --txt: #f6ffe8;
    --dim: #9aa38a;
    --acc: #d9f939;
    --acc2: #f2ff7a;
    --accink: #141600;
    --red: #ff5a3c;
    --green: #d9f939;
    --blue: #2962ff;
    --r: 18px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    background-image:
      radial-gradient(90% 32% at 50% 0%, rgba(217,249,57,.10), transparent 65%),
      repeating-linear-gradient(45deg, rgba(255,255,255,.015) 0 2px, transparent 2px 6px),
      repeating-linear-gradient(-45deg, rgba(0,0,0,.12) 0 2px, transparent 2px 6px);
    background-attachment: fixed;
    color: var(--txt);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 16px;
    user-select: none;
    -webkit-user-select: none;
    overscroll-behavior: none;
  }
  #app { max-width: 480px; margin: 0 auto; padding: 10px 14px 90px; }

  /* ── шапка ── */
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 4px 2px 10px; }
  .logo { font-weight: 900; letter-spacing: 3px; font-size: 14px; color: var(--dim); }
  .logo b { color: var(--acc); }
  .gearbtn {
    background: var(--card); border: 1px solid var(--line); color: var(--txt);
    height: 40px; padding: 0 14px; border-radius: 12px; font-size: 14px;
    font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px;
  }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--r);
    padding: 14px; margin-bottom: 12px;
    box-shadow: 0 4px 14px rgba(0,0,0,.25);
  }
  .cardtitle { font-size: 12px; font-weight: 700; letter-spacing: 1.5px; color: var(--dim); margin-bottom: 10px; }

  /* ── машина уровня ── */
  .hero { position: relative; width: 88%; margin: -6px auto -10px; }
  .hero::before {
    content: ""; position: absolute; inset: -70px -60px -70px; z-index: -1;
    background: radial-gradient(72% 64% at 50% 46%,
      rgba(232,255,95,.50) 0%, rgba(217,249,57,.26) 45%, rgba(217,249,57,.08) 65%, transparent 78%);
  }
  .hero svg, .hero img { width: 100%; display: block; }

  /* ── номерной знак ── */
  .plate-wrap { display: flex; flex-direction: column; align-items: center; margin-bottom: 14px; }
  .plate-wrap { perspective: 700px; }
  .plate {
    width: 88%; max-width: 340px; aspect-ratio: 720 / 222;
    position: relative;
    background: center / contain no-repeat;
    transform: rotateX(9deg);
    filter: drop-shadow(0 10px 16px rgba(0,0,0,.45));
    animation: platefloat 3.2s ease-in-out infinite alternate;
  }
  @keyframes platefloat {
    from { transform: rotateX(9deg) translateY(0); }
    to   { transform: rotateX(5deg) translateY(-4px); }
  }
  .plate-name {
    position: absolute; left: 17%; right: 4.5%; top: 12%; bottom: 16%;
    display: flex; align-items: center; justify-content: center;
    color: #111; font-weight: 900; letter-spacing: 2px;
    font-size: 34px; padding: 0 8px; white-space: nowrap; overflow: hidden;
    text-transform: uppercase;
    text-shadow: 0 1px 0 #fff, 0 2px 2px rgba(0,0,0,.28);
    font-family: "Arial Black", Arial, sans-serif;
  }
  .plate-level { margin-top: 6px; font-size: 13px; color: var(--dim); }
  .plate-level b { color: var(--acc2); }

  /* ── спидометр ── */
  .speedo { display: flex; flex-direction: column; align-items: center; }
  .speedo svg { width: 100%; max-width: 300px; display: block; }
  .needle { transition: transform .7s cubic-bezier(.3, 1.9, .4, .9); transform-origin: 110px 110px; }
  .speedo-val { font-size: 26px; font-weight: 900; margin-top: -6px; }
  .speedo-sub { font-size: 12px; color: var(--dim); margin-top: 2px; }

  .row2 { display: flex; gap: 12px; }
  .row2 .card { flex: 1; min-width: 0; margin-bottom: 12px; }

  /* ── бак ── */
  .tankbox { display: flex; gap: 12px; align-items: center; }
  .tank {
    width: 58px; height: 108px; border: 3px solid var(--line); border-radius: 12px;
    position: relative; overflow: hidden; background: #16181c; flex: none;
  }
  .tank-fill {
    position: absolute; left: 0; right: 0; bottom: 0; height: 0%;
    background: linear-gradient(180deg, var(--acc2), var(--acc));
    transition: height .8s ease;
  }
  .tank-full { animation: glow 1.2s ease-in-out infinite alternate; }
  @keyframes glow { from { box-shadow: 0 0 4px var(--acc); } to { box-shadow: 0 0 16px var(--acc); } }
  .tank-info { font-size: 13px; line-height: 1.5; }
  .tank-info .big { font-size: 19px; font-weight: 800; }
  .tank-info .goal { color: var(--dim); }
  .tank-ready { color: var(--acc2); font-weight: 800; }

  /* ── одометр ── */
  .odo { display: flex; gap: 3px; justify-content: center; margin: 6px 0; }
  .odo span {
    background: #10120a; border: 1px solid #000; border-radius: 5px; color: #eaffb0;
    flex: 1; max-width: 24px; height: 34px; display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 900; font-variant-numeric: tabular-nums;
  }
  .odo span:last-child { background: var(--acc); color: var(--accink); }
  .odo-sub { text-align: center; font-size: 12px; color: var(--dim); }
  .lvl-progress { margin-top: 10px; }
  .bar { height: 8px; background: #14161a; border-radius: 99px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--acc2), var(--acc)); border-radius: 99px; transition: width .6s ease; }
  .lvl-progress .lbl { font-size: 11px; color: var(--dim); margin-top: 5px; text-align: center; }

  /* ── табло ── */
  .board { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .board .sum { font-size: 22px; font-weight: 900; color: var(--acc); white-space: nowrap; }
  .board .sub { font-size: 12px; color: var(--dim); }

  /* ── кнопки ── */
  .btn {
    background: linear-gradient(180deg, var(--acc2), var(--acc));
    border: none; color: var(--accink); font-weight: 800; font-size: 15px;
    padding: 12px 18px; border-radius: 14px; cursor: pointer;
    box-shadow: 0 0 18px rgba(217,249,57,.30);
  }
  .btn:active { transform: scale(.96); }
  .btn:disabled { background: var(--card2); color: var(--dim); }
  .btn.ghost { background: var(--card2); color: var(--txt); border: 1px solid var(--line); }
  .btn.danger { background: #5c1f1f; color: #ffb3b3; border: 1px solid #7c2b2b; }
  .btn.small { padding: 8px 12px; font-size: 13px; border-radius: 10px; }

  /* ── состояние дня ── */
  .mood { display: flex; gap: 10px; }
  .mood button {
    flex: 1; background: var(--card2); border: 2px solid var(--line); border-radius: 14px;
    padding: 10px 4px; color: var(--txt); font-size: 13px; cursor: pointer;
  }
  .mood button .em { font-size: 26px; display: block; margin-bottom: 4px; }
  .mood button.sel { border-color: var(--acc); background: #262b10; }

  /* ── задачи ── */
  .cat { margin-bottom: 12px; border-radius: var(--r); overflow: hidden; border: 1px solid var(--line); }
  .cat-head {
    display: flex; align-items: center; gap: 10px; padding: 14px;
    background: var(--card2); cursor: pointer; font-weight: 800; font-size: 16px;
  }
  .cat-head .cnt { margin-left: auto; font-size: 13px; color: var(--dim); font-weight: 600; }
  .cat-head .chev { transition: transform .25s; font-size: 12px; color: var(--dim); }
  .cat.open .chev { transform: rotate(90deg); }
  .cat-body { display: none; background: var(--card); }
  .cat.open .cat-body { display: block; }
  .task { display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-top: 1px solid var(--line); cursor: pointer; }
  .task:active { background: rgba(255,255,255,.03); }
  .chk {
    width: 30px; height: 30px; border: 2px solid var(--line); border-radius: 10px; flex: none;
    display: flex; align-items: center; justify-content: center; font-size: 18px;
    background: #16181c; transition: all .2s;
  }
  .task.done .chk { background: var(--green); border-color: var(--green); color: var(--accink); }
  .task-mid { flex: 1; min-width: 0; }
  .task-title { font-size: 15px; font-weight: 600; }
  .task.done .task-title { color: var(--dim); text-decoration: line-through; }
  .task-meta { display: flex; align-items: center; gap: 8px; margin-top: 5px; }
  .streak { font-size: 12px; color: var(--acc2); font-weight: 700; }
  .dots { display: flex; gap: 3px; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: #3a3f48; }
  .dots i.on { background: var(--acc); }
  .dots i.today { outline: 1px solid var(--dim); outline-offset: 1px; }
  .pts { font-size: 14px; font-weight: 800; color: var(--acc2); flex: none; }

  /* ── поведение ── */
  .beh-card {
    display: flex; align-items: center; gap: 14px; width: 100%;
    background: var(--card); border: 2px solid var(--line); border-radius: var(--r);
    padding: 16px 14px; margin-bottom: 12px; color: var(--txt); cursor: pointer; text-align: left;
  }
  .beh-card .em { font-size: 32px; }
  .beh-card .t { font-weight: 800; font-size: 16px; }
  .beh-card .d { font-size: 13px; color: var(--dim); margin-top: 3px; }
  .beh-card .val { margin-left: auto; font-weight: 900; color: var(--acc2); font-size: 15px; flex: none; }
  .beh-card.sel { border-color: var(--acc); background: #262b10; }
  .beh-card:disabled { opacity: .45; }
  .beh-card.sel:disabled { opacity: 1; }
  .beh-note { text-align: center; color: var(--dim); font-size: 14px; margin-top: 4px; }

  /* ── награды ── */
  .reward { margin-bottom: 12px; }
  .reward-top { display: flex; align-items: center; gap: 10px; }
  .reward-title { font-weight: 800; font-size: 16px; flex: 1; }
  .reward-cost { font-weight: 900; color: var(--acc2); }
  .reward .bar { margin: 10px 0; }
  .reward-bot { display: flex; align-items: center; justify-content: space-between; }
  .reward-got { font-size: 12px; color: var(--dim); }

  /* ── нижнее меню ── */
  nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
    background: #101207; border-top: 1px solid var(--line);
    display: flex; max-width: 480px; margin: 0 auto;
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav button {
    flex: 1; background: none; border: none; color: var(--dim);
    padding: 9px 0 7px; font-size: 11px; font-weight: 700; cursor: pointer;
  }
  nav button .em { display: block; font-size: 22px; margin-bottom: 2px; filter: grayscale(1) opacity(.6); }
  nav button.sel { color: var(--acc); }
  nav button.sel .em { filter: none; }

  /* ── модалки ── */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.72); z-index: 100;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .modal {
    background: var(--card); border: 1px solid var(--line); border-radius: 20px;
    width: 100%; max-width: 360px; padding: 20px; max-height: 86vh; overflow-y: auto;
  }
  .modal h3 { font-size: 18px; margin-bottom: 12px; }
  .modal p { color: var(--dim); font-size: 14px; line-height: 1.5; margin-bottom: 14px; }
  .modal .mbtns { display: flex; gap: 10px; margin-top: 16px; }
  .modal .mbtns .btn { flex: 1; }
  .inp {
    width: 100%; background: #16181c; border: 1px solid var(--line); border-radius: 12px;
    color: var(--txt); font-size: 17px; padding: 12px 14px; outline: none;
  }
  .inp:focus { border-color: var(--acc); }
  .stepper { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 14px 0; }
  .stepper button {
    background: var(--card2); border: 1px solid var(--line); color: var(--txt);
    width: 48px; height: 44px; border-radius: 12px; font-size: 15px; font-weight: 800; cursor: pointer;
  }
  .xchg-view { text-align: center; font-size: 20px; font-weight: 900; }
  .xchg-view small { display: block; font-size: 13px; color: var(--dim); font-weight: 600; margin-top: 4px; }

  /* ── родительский режим ── */
  .prow { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
  .prow .inp { flex: 1; }
  .plist { border-top: 1px solid var(--line); margin-top: 8px; }
  .plist-item { display: flex; align-items: center; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .plist-item .nm { flex: 1; }
  .del {
    background: none; border: none; color: var(--red); font-size: 18px; cursor: pointer;
    width: 34px; height: 34px; flex: none;
  }
  .switch { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .toggle { position: relative; width: 52px; height: 30px; flex: none; }
  .toggle input { display: none; }
  .toggle span {
    position: absolute; inset: 0; background: var(--card2); border: 1px solid var(--line);
    border-radius: 99px; cursor: pointer; transition: .2s;
  }
  .toggle span::after {
    content: ""; position: absolute; width: 22px; height: 22px; border-radius: 50%;
    background: var(--dim); top: 3px; left: 3px; transition: .2s;
  }
  .toggle input:checked + span { background: var(--acc); border-color: var(--acc); }
  .toggle input:checked + span::after { background: #fff; transform: translateX(22px); }

  select.inp { appearance: none; }

  /* ── конфетти ── */
  .cf {
    position: fixed; top: -14px; width: 9px; height: 14px; z-index: 200; pointer-events: none;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(720deg); opacity: .7; }
  }

  .hidden { display: none !important; }
  h2.pagetitle { font-size: 20px; font-weight: 900; margin: 4px 2px 14px; letter-spacing: .5px; }
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="logo">🏁 <b>ГАРАЖ</b></div>
    <button class="gearbtn" id="gearBtn" title="Родительский режим">⚙️ Родитель</button>
  </div>
  <div id="page"></div>
</div>

<nav id="nav">
  <button data-tab="garage" class="sel"><span class="em">🏎</span>Гараж</button>
  <button data-tab="tasks"><span class="em">🔧</span>Задачи</button>
  <button data-tab="beh"><span class="em">🏁</span>Поведение</button>
  <button data-tab="rewards"><span class="em">🏆</span>Награды</button>
</nav>

<script>
"use strict";

/* ================= ДАННЫЕ ================= */

const KEY = "garage_tracker_v1";
const VERSION = 1;

const LEVELS = [
  { name: "Карт",      emoji: "🛞", min: 0 },
  { name: "Хэтчбек",   emoji: "🚗", min: 50 },
  { name: "Седан",     emoji: "🚘", min: 120 },
  { name: "Спорткупе", emoji: "🏁", min: 250 },
  { name: "Дрифт-кар", emoji: "🔥", min: 450 },
  { name: "Ралли-кар", emoji: "🌪", min: 700 },
  { name: "BMW M",     emoji: "🚙", min: 1000 },
  { name: "Audi RS",   emoji: "🏎", min: 1400 },
  { name: "Гиперкар",  emoji: "⚡", min: 2000 },
  { name: "Болид F1",  emoji: "🥇", min: 2800 },
];

const BONUS7 = 10; // бонус-гайки за серию 7 дней подряд

const CATS = {
  study:  { emoji: "📚", name: "УЧЁБА" },
  health: { emoji: "💚", name: "ЗДОРОВЬЕ" },
  sport:  { emoji: "🏊", name: "СПОРТ" },
};

function uid() { return Math.random().toString(36).slice(2, 9); }

function freshState() {
  return {
    v: VERSION,
    name: "",
    pin: "1234",
    rate: 1,             // рублей за 1 гайку
    hard: false,         // жёсткие штрафы
    bal: 0,              // гайки на руках
    odo: 0,              // общий пробег (только растёт)
    rub: 0,              // накоплено на буфет, ₽
    level: 0,
    today: todayStr(),
    weekStart: mondayStr(todayStr()),
    mood: null,          // stall | drive | full
    beh: null,           // clean | even | skid
    behStreak: 0,
    earnedToday: 0,
    streakBonus: {},     // выданные бонусы за серии 7 дней
    pending: [],         // забранные награды, которые папа ещё не выдал
    tasks: [
      { id: uid(), cat: "study",  title: "Сделал уроки",            pts: 3,  done: false, streak: 0, week: [0,0,0,0,0,0,0] },
      { id: uid(), cat: "study",  title: "Собрал рюкзак",           pts: 3,  done: false, streak: 0, week: [0,0,0,0,0,0,0] },
      { id: uid(), cat: "study",  title: "Хорошая оценка",          pts: 5,  done: false, streak: 0, week: [0,0,0,0,0,0,0] },
      { id: uid(), cat: "health", title: "Стакан воды",             pts: 2,  done: false, streak: 0, week: [0,0,0,0,0,0,0] },
      { id: uid(), cat: "health", title: "Зубы утром",              pts: 2,  done: false, streak: 0, week: [0,0,0,0,0,0,0] },
      { id: uid(), cat: "health", title: "Зубы вечером",            pts: 2,  done: false, streak: 0, week: [0,0,0,0,0,0,0] },
      { id: uid(), cat: "health", title: "Лёг спать вовремя",       pts: 2,  done: false, streak: 0, week: [0,0,0,0,0,0,0] },
      { id: uid(), cat: "sport",  title: "Тренировка по плаванию",  pts: 5,  done: false, streak: 0, week: [0,0,0,0,0,0,0] },
      { id: uid(), cat: "sport",  title: "Силовая дома",            pts: 8,  done: false, streak: 0, week: [0,0,0,0,0,0,0] },
      { id: uid(), cat: "sport",  title: "Соревнования",            pts: 30, done: false, streak: 0, week: [0,0,0,0,0,0,0] },
      { id: uid(), cat: "sport",  title: "Личный рекорд",           pts: 50, done: false, streak: 0, week: [0,0,0,0,0,0,0] },
    ],
    rewards: [
      { id: uid(), title: "Мороженое",       cost: 30,  got: 0 },
      { id: uid(), title: "Час игры",        cost: 60,  got: 0 },
      { id: uid(), title: "Большая покупка", cost: 220, got: 0 },
    ],
  };
}

function migrate(s) {
  if (!s || typeof s !== "object") return freshState();
  if (!s.v) s.v = 1;
  /* будущие миграции:
     if (s.v === 1) { ...превратить в v2...; s.v = 2; } */
  const d = freshState();
  for (const k in d) if (s[k] === undefined) s[k] = d[k];
  s.tasks.forEach(t => { if (!Array.isArray(t.week) || t.week.length !== 7) t.week = [0,0,0,0,0,0,0]; });
  return s;
}

function load() {
  let raw = null;
  try { raw = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  return raw ? migrate(raw) : freshState();
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
}

let state = load();
const ui = { tab: "garage", open: { study: true, health: true, sport: true }, parent: false };

/* ================= ДАТЫ ================= */

function todayStr(d) {
  d = d || new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function dow(s) { // Пн=0 ... Вс=6
  const d = s ? new Date(s + "T12:00:00") : new Date();
  return (d.getDay() + 6) % 7;
}
function mondayStr(s) {
  const d = new Date(s + "T12:00:00");
  d.setDate(d.getDate() - dow(s));
  return todayStr(d);
}
function daysBetween(a, b) {
  return Math.round((new Date(b + "T12:00:00") - new Date(a + "T12:00:00")) / 86400000);
}

/* ежедневный сброс: галочки и состояние дня очищаются, серии и пробег живут */
function rollover() {
  const t = todayStr();
  if (state.today === t) return false;
  const gap = daysBetween(state.today, t);
  state.tasks.forEach(k => {
    if (gap > 1 || !k.done) k.streak = 0;
    k.done = false;
  });
  if (gap > 1) state.behStreak = 0;
  state.mood = null;
  state.beh = null;
  state.earnedToday = 0;
  state.today = t;
  const ws = mondayStr(t);
  if (ws !== state.weekStart) {
    state.weekStart = ws;
    state.tasks.forEach(k => k.week = [0,0,0,0,0,0,0]);
  }
  return true;
}

/* ================= МОДАЛКИ (свои, на промисах) ================= */

function openModal(html) {
  const ov = document.createElement("div");
  ov.className = "overlay";
  ov.innerHTML = '<div class="modal">' + html + "</div>";
  document.body.appendChild(ov);
  return ov;
}
function closeModal(ov) { ov.remove(); }

function modalAlert(title, text) {
  return new Promise(res => {
    const ov = openModal("<h3>" + title + "</h3>" + (text ? "<p>" + text + "</p>" : "") +
      '<div class="mbtns"><button class="btn" id="mok">Понятно</button></div>');
    ov.querySelector("#mok").onclick = () => { closeModal(ov); res(); };
  });
}
function modalConfirm(title, text, okLabel, danger) {
  return new Promise(res => {
    const ov = openModal("<h3>" + title + "</h3>" + (text ? "<p>" + text + "</p>" : "") +
      '<div class="mbtns"><button class="btn ghost" id="mno">Отмена</button>' +
      '<button class="btn' + (danger ? " danger" : "") + '" id="mok">' + (okLabel || "Да") + "</button></div>");
    ov.querySelector("#mok").onclick = () => { closeModal(ov); res(true); };
    ov.querySelector("#mno").onclick = () => { closeModal(ov); res(false); };
  });
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* первый запуск: спросить имя своим окном */
function askName() {
  return new Promise(res => {
    const ov = openModal(
      "<h3>🏁 Привет, гонщик!</h3>" +
      "<p>Как тебя зовут? Имя появится на твоём номерном знаке.</p>" +
      '<input class="inp" id="mname" maxlength="14" placeholder="Твоё имя" autocomplete="off">' +
      '<div class="mbtns"><button class="btn" id="mok" disabled>Поехали! 🏎</button></div>');
    const inp = ov.querySelector("#mname"), ok = ov.querySelector("#mok");
    inp.oninput = () => { ok.disabled = !inp.value.trim(); };
    inp.onkeydown = e => { if (e.key === "Enter" && inp.value.trim()) ok.click(); };
    ok.onclick = () => { const v = inp.value.trim(); closeModal(ov); res(v); };
    setTimeout(() => inp.focus(), 100);
  });
}

function askPin() {
  return new Promise(res => {
    const ov = openModal(
      "<h3>⚙️ Родительский режим</h3><p>Введите PIN-код.</p>" +
      '<input class="inp" id="mpin" type="password" inputmode="numeric" maxlength="6" placeholder="PIN">' +
      '<div class="mbtns"><button class="btn ghost" id="mno">Отмена</button><button class="btn" id="mok">Войти</button></div>');
    const inp = ov.querySelector("#mpin");
    ov.querySelector("#mno").onclick = () => { closeModal(ov); res(false); };
    ov.querySelector("#mok").onclick = () => {
      if (inp.value === state.pin) { closeModal(ov); res(true); }
      else { inp.value = ""; inp.placeholder = "Неверный PIN"; inp.style.borderColor = "var(--red)"; }
    };
    inp.onkeydown = e => { if (e.key === "Enter") ov.querySelector("#mok").click(); };
    setTimeout(() => inp.focus(), 100);
  });
}

/* обмен гаек на рубли */
function exchangeModal() {
  if (state.bal <= 0) { modalAlert("Пока пусто 🔩", "Сначала заработай гайки — выполняй задачи!"); return; }
  let amount = state.bal;
  const ov = openModal(
    "<h3>💰 Обмен гаек</h3>" +
    "<p>Курс: 1 гайка = " + fmt(state.rate) + " ₽. У тебя " + state.bal + " 🔩</p>" +
    '<div class="stepper">' +
      '<button data-d="-10">−10</button><button data-d="-1">−1</button>' +
      '<button data-d="1">+1</button><button data-d="10">+10</button>' +
      '<button data-d="all">ВСЁ</button></div>' +
    '<div class="xchg-view"><span id="xa"></span><small id="xr"></small></div>' +
    '<div class="mbtns"><button class="btn ghost" id="mno">Отмена</button><button class="btn" id="mok">Обменять</button></div>');
  const xa = ov.querySelector("#xa"), xr = ov.querySelector("#xr");
  function upd() {
    xa.textContent = amount + " 🔩";
    xr.textContent = "→ " + fmt(amount * state.rate) + " ₽ на буфет";
    ov.querySelector("#mok").disabled = amount <= 0;
  }
  ov.querySelectorAll(".stepper button").forEach(b => b.onclick = () => {
    if (b.dataset.d === "all") amount = state.bal;
    else amount = Math.max(0, Math.min(state.bal, amount + Number(b.dataset.d)));
    upd();
  });
  ov.querySelector("#mno").onclick = () => closeModal(ov);
  ov.querySelector("#mok").onclick = () => {
    state.bal -= amount;
    state.rub = round2(state.rub + amount * state.rate);
    save(); closeModal(ov); render();
    modalAlert("Готово! 💰", "На табло теперь " + fmt(state.rub) + " ₽. Папа выдаст деньги на буфет.");
  };
  upd();
}

function fmt(n) { return (Math.round(n * 100) / 100).toLocaleString("ru-RU"); }
function round2(n) { return Math.round(n * 100) / 100; }

/* ================= ИГРОВАЯ ЛОГИКА ================= */

function levelIdx(odo) {
  let i = 0;
  LEVELS.forEach((l, n) => { if (odo >= l.min) i = n; });
  return i;
}

function addPts(p) {
  state.bal += p;
  state.odo += p;
  state.earnedToday += p;
  const nl = levelIdx(state.odo);
  if (nl > state.level) {
    state.level = nl;
    save();
    confetti();
    modalAlert(LEVELS[nl].emoji + " Новый уровень!", "Ты теперь — «" + LEVELS[nl].name + "»! Так держать, гонщик!");
  } else {
    state.level = nl;
  }
}

function toggleTask(id) {
  rollover();
  const k = state.tasks.find(t => t.id === id);
  if (!k) return;
  const d = dow();
  if (!k.done) {
    k.done = true;
    k.streak++;
    k.week[d] = 1;
    addPts(k.pts);
    if (k.streak > 0 && k.streak % 7 === 0) { // бонус за серию 7 дней
      state.streakBonus[k.id + ":" + k.streak] = 1;
      addPts(BONUS7);
      save();
      confetti();
      modalAlert("🔥 Серия " + k.streak + " дней!", "+" + BONUS7 + " 🔩 бонус за «" + esc(k.title) + "»! Так держать!");
    }
  } else {
    // отмена случайной галочки в тот же день
    let minus = k.pts;
    const bkey = k.id + ":" + k.streak;
    if (state.streakBonus[bkey]) { delete state.streakBonus[bkey]; minus += BONUS7; }
    k.done = false;
    k.streak = Math.max(0, k.streak - 1);
    k.week[d] = 0;
    state.bal = Math.max(0, state.bal - minus);
    state.odo = Math.max(0, state.odo - minus);
    state.earnedToday = Math.max(0, state.earnedToday - minus);
    state.level = levelIdx(state.odo);
  }
  save();
  render();
}

async function pickBehavior(v) {
  rollover();
  if (state.beh) return;
  const names = { clean: "🏁 Чистый заезд", even: "🚗 Ехал ровно", skid: "🔧 Занесло на повороте" };
  const ok = await modalConfirm(names[v], "Отметить можно один раз в день, до завтра не изменить. Точно?", "Отметить");
  if (!ok) return;
  state.beh = v;
  if (v === "clean") { state.behStreak++; addPts(5); }
  else if (v === "even") { addPts(2); }
  else if (v === "skid") {
    state.behStreak = 0;
    if (state.hard) state.tasks.forEach(k => k.streak = 0); // жёсткие штрафы: сгорают все серии
  }
  save();
  render();
  if (v === "clean") confetti();
}

async function claimReward(id) {
  rollover();
  const r = state.rewards.find(x => x.id === id);
  if (!r || state.bal < r.cost) return;
  const ok = await modalConfirm("🏆 " + esc(r.title), "Обменять " + r.cost + " 🔩 на эту награду?", "Забрать!");
  if (!ok) return;
  state.bal -= r.cost;
  r.got = (r.got || 0) + 1;
  state.pending.push({ id: uid(), title: r.title, date: todayStr() });
  save();
  render();
  confetti();
  modalAlert("🎉 Поздравляем!", "Награда «" + esc(r.title) + "» твоя! Скажи папе — она ждёт выдачи.");
}

function carSVG(lvl) {
  if (CAR_IMAGES[lvl]) return '<img src="' + CAR_IMAGES[lvl] + '" alt="">';
  const defs = '<defs><linearGradient id="hb" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0" stop-color="#4a5158"/><stop offset=".55" stop-color="#31363c"/><stop offset="1" stop-color="#1d2126"/></linearGradient>' +
    '<filter id="hsoft"><feGaussianBlur stdDeviation="5"/></filter>' +
    '<filter id="hg"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>';
  const glow = '<ellipse cx="170" cy="112" rx="140" ry="11" fill="#d9f939" opacity=".45" filter="url(#hsoft)"/>' +
    '<ellipse cx="170" cy="112" rx="95" ry="6" fill="#f2ff7a" opacity=".5" filter="url(#hsoft)"/>';
  const wheel = (x, r) => '<circle cx="' + x + '" cy="98" r="' + r + '" fill="#08090a"/>' +
    '<circle cx="' + x + '" cy="98" r="' + (r - 8) + '" fill="#101214" stroke="#d9f939" stroke-width="2"/>' +
    '<g stroke="#d9f939" stroke-width="2" stroke-linecap="round">' +
    '<line x1="' + x + '" y1="' + (98 - r + 11) + '" x2="' + x + '" y2="' + (98 + r - 11) + '"/>' +
    '<line x1="' + (x - r + 11) + '" y1="98" x2="' + (x + r - 11) + '" y2="98"/></g>' +
    '<circle cx="' + x + '" cy="98" r="3" fill="#d9f939"/>';
  let body = "";
  if (lvl === 0) { // карт
    body = '<path fill="url(#hb)" d="M46 90 L84 80 L128 78 L156 58 L196 58 L214 78 L272 82 C284 84 288 88 286 94 L280 98 L52 98 C46 96 44 93 46 90 Z"/>' +
      '<path d="M158 60 L194 60 L200 70 L152 70 Z" fill="#15181c"/>' +
      '<path d="M206 58 L206 44 L222 44" stroke="#d9f939" stroke-width="4" fill="none" stroke-linecap="round" filter="url(#hg)"/>' +
      wheel(96, 15) + wheel(246, 15);
  } else if (lvl <= 2) { // хэтчбек · седан
    body = '<path fill="url(#hb)" d="M36 94 C33 84 40 77 54 74 L88 69 C108 50 138 43 170 43 C202 43 228 51 246 68 L284 74 C300 78 306 86 304 94 C303 98 298 100 290 100 L48 100 C40 100 37 98 36 94 Z"/>' +
      '<path fill="#15181c" d="M100 67 C116 53 142 47 166 47 L166 67 Z M174 47 C198 49 218 56 232 65 L174 67 Z"/>' +
      '<path d="M48 92 L292 92" stroke="#d9f939" stroke-width="2" opacity=".35" filter="url(#hg)"/>' +
      '<path d="M288 78 L302 82" stroke="#f2ff7a" stroke-width="4" stroke-linecap="round" filter="url(#hg)"/>' +
      '<path d="M38 82 L48 79" stroke="#ff5a3c" stroke-width="4" stroke-linecap="round" filter="url(#hg)"/>' +
      wheel(98, 19) + wheel(242, 19);
  } else if (lvl <= 6) { // спорткупе · дрифт · ралли · BMW M
    body = '<path fill="url(#hb)" d="M30 94 C27 85 34 78 50 75 L86 70 C104 48 136 38 172 38 C210 38 240 50 256 68 L290 73 C306 77 312 85 310 93 C309 98 304 100 296 100 L44 100 C36 100 32 98 30 94 Z"/>' +
      '<path fill="#15181c" d="M98 66 C116 49 144 42 170 42 L170 66 Z M178 42 C204 44 226 53 240 64 L178 66 Z"/>' +
      '<path fill="#23262a" d="M28 72 L60 65 L62 72 L32 78 Z"/>' +
      '<path d="M42 92 L298 92" stroke="#d9f939" stroke-width="2.5" opacity=".5" filter="url(#hg)"/>' +
      '<path d="M292 77 L306 81 M290 84 L305 87" stroke="#f2ff7a" stroke-width="3.5" stroke-linecap="round" filter="url(#hg)"/>' +
      '<path d="M32 82 L44 79" stroke="#ff5a3c" stroke-width="4" stroke-linecap="round" filter="url(#hg)"/>' +
      wheel(96, 20) + wheel(246, 20);
  } else { // Audi RS · гиперкар
    body = '<path fill="url(#hb)" d="M24 94 C21 86 28 80 46 77 L82 73 C100 56 134 46 174 46 C216 46 248 56 264 70 L296 74 C312 78 318 86 316 93 C315 98 310 100 300 100 L38 100 C30 100 26 98 24 94 Z"/>' +
      '<path fill="#15181c" d="M96 70 C116 56 148 50 176 50 L176 70 Z M184 50 C212 52 234 60 248 68 L184 70 Z"/>' +
      '<path fill="#23262a" d="M20 68 L64 60 L66 68 L24 76 Z M62 60 L62 52 L70 52 L70 60 Z"/>' +
      '<path d="M36 92 L304 92" stroke="#d9f939" stroke-width="3" opacity=".6" filter="url(#hg)"/>' +
      '<path d="M296 78 L312 82" stroke="#f2ff7a" stroke-width="5" stroke-linecap="round" filter="url(#hg)"/>' +
      '<path d="M26 80 L40 77" stroke="#ff5a3c" stroke-width="5" stroke-linecap="round" filter="url(#hg)"/>' +
      wheel(92, 21) + wheel(248, 21);
  }
  return '<svg viewBox="0 0 340 130">' + defs + glow + body + "</svg>";
}

/* цель бака: самая дешёвая награда */
function tankGoal() {
  if (!state.rewards.length) return null;
  return state.rewards.slice().sort((a, b) => a.cost - b.cost)[0];
}

/* ================= КОНФЕТТИ ================= */

function confetti() {
  const colors = ["#d9f939", "#f2ff7a", "#ffd54f", "#ffffff", "#2962ff", "#ff5a3c", "#a5ffcb"];
  for (let i = 0; i < 60; i++) {
    const c = document.createElement("div");
    c.className = "cf";
    c.style.left = Math.random() * 100 + "vw";
    c.style.background = colors[i % colors.length];
    c.style.animationDuration = (1.2 + Math.random() * 1.4) + "s";
    c.style.animationDelay = (Math.random() * .3) + "s";
    c.style.transform = "rotate(" + Math.random() * 360 + "deg)";
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 3200);
  }
}

/* ================= РЕНДЕР ================= */

const page = document.getElementById("page");

function render() {
  if (ui.parent) { renderParent(); return; }
  if (ui.tab === "garage") renderGarage();
  else if (ui.tab === "tasks") renderTasks();
  else if (ui.tab === "beh") renderBeh();
  else renderRewards();
  document.querySelectorAll("#nav button").forEach(b =>
    b.classList.toggle("sel", b.dataset.tab === ui.tab && !ui.parent));
}

/* — гараж — */
function renderGarage() {
  const lvl = LEVELS[levelIdx(state.odo)];
  const next = LEVELS[levelIdx(state.odo) + 1];
  const goal = tankGoal();
  const tankPct = goal ? Math.min(100, Math.round(state.bal / goal.cost * 100)) : 0;
  // шкала дня — по повседневным задачам (редкие крупные вроде соревнований не в счёт)
  const maxToday = Math.max(20, state.tasks.filter(t => t.pts <= 10).reduce((s, t) => s + t.pts, 0) + 5);
  const pct = Math.min(1, state.earnedToday / Math.max(1, maxToday));
  const deg = -90 + pct * 180;
  const odoDigits = String(Math.min(999999, state.odo)).padStart(6, "0")
    .split("").map(d => "<span>" + d + "</span>").join("");
  const lvlPct = next ? Math.min(100, Math.round((state.odo - lvl.min) / (next.min - lvl.min) * 100)) : 100;

  page.innerHTML =
    '<div class="hero">' + carSVG(levelIdx(state.odo)) + "</div>" +
    '<div class="plate-wrap">' +
      '<div class="plate" style="background-image:url(' + PLATE_IMG + ')">' +
      '<div class="plate-name" id="plateName">' + esc(state.name || "ГОНЩИК") + "</div></div>" +
      '<div class="plate-level">' + lvl.emoji + ' Уровень: <b>' + lvl.name + "</b></div>" +
    "</div>" +

    '<div class="card speedo">' +
      '<div class="cardtitle">🏎 СПИДОМЕТР — ПРОГРЕСС ДНЯ</div>' +
      '<svg viewBox="0 0 220 130">' +
        '<path d="M 20 110 A 90 90 0 0 1 110 20" fill="none" stroke="#43520f" stroke-width="14" stroke-linecap="round"/>' +
        '<path d="M 110 20 A 90 90 0 0 1 173.6 46.4" fill="none" stroke="#6b7a1a" stroke-width="14"/>' +
        '<path d="M 173.6 46.4 A 90 90 0 0 1 200 110" fill="none" stroke="#7a2b1a" stroke-width="14" stroke-linecap="round"/>' +
        '<path d="M 20 110 A 90 90 0 0 1 110 20" fill="none" stroke="var(--green)" stroke-width="6" stroke-linecap="round" opacity=".9"/>' +
        '<path d="M 110 20 A 90 90 0 0 1 173.6 46.4" fill="none" stroke="var(--acc2)" stroke-width="6" opacity=".9"/>' +
        '<path d="M 173.6 46.4 A 90 90 0 0 1 200 110" fill="none" stroke="var(--red)" stroke-width="6" stroke-linecap="round" opacity=".9"/>' +
        '<line class="needle" x1="110" y1="110" x2="110" y2="32" stroke="#fff" stroke-width="5" stroke-linecap="round" style="transform:rotate(' + deg + 'deg)"/>' +
        '<circle cx="110" cy="110" r="10" fill="var(--acc)"/>' +
      "</svg>" +
      '<div class="speedo-val">' + state.earnedToday + " 🔩</div>" +
      '<div class="speedo-sub">заработано сегодня из ~' + maxToday + "</div>" +
    "</div>" +

    '<div class="row2">' +
      '<div class="card"><div class="cardtitle">⛽ БАК</div>' +
        '<div class="tankbox">' +
          '<div class="tank' + (tankPct >= 100 ? " tank-full" : "") + '"><div class="tank-fill" style="height:' + tankPct + '%"></div></div>' +
          '<div class="tank-info">' +
            (goal
              ? '<div class="big">' + tankPct + "%</div>" +
                '<div class="goal">до «' + esc(goal.title) + "»<br>" + Math.min(state.bal, goal.cost) + " / " + goal.cost + " 🔩</div>" +
                (tankPct >= 100 ? '<div class="tank-ready">Полный бак!<br>Награда доступна 🏆</div>' : "")
              : '<div class="goal">Наград пока нет</div>') +
          "</div></div></div>" +
      '<div class="card"><div class="cardtitle">📟 ОДОМЕТР</div>' +
        '<div class="odo">' + odoDigits + "</div>" +
        '<div class="odo-sub">общий пробег, 🔩</div>' +
        '<div class="lvl-progress"><div class="bar"><i style="width:' + lvlPct + '%"></i></div>' +
        '<div class="lbl">' + (next ? "до «" + next.name + "» осталось " + (next.min - state.odo) + " 🔩" : "Максимальный уровень! 🏆") + "</div></div>" +
      "</div>" +
    "</div>" +

    '<div class="card"><div class="cardtitle">💰 ТАБЛО</div>' +
      '<div class="board"><div><div class="sum">' + fmt(state.rub) + ' ₽</div><div class="sub">накоплено на буфет · на руках ' + state.bal + " 🔩</div></div>" +
      '<button class="btn" id="xchgBtn">Обменять</button></div></div>' +

    '<div class="card"><div class="cardtitle">СОСТОЯНИЕ ДНЯ</div>' +
      '<div class="mood">' +
        moodBtn("stall", "😴", "заглох") + moodBtn("drive", "🙂", "еду") + moodBtn("full", "🔥", "полный газ") +
      "</div></div>";

  fitPlate();
  document.getElementById("xchgBtn").onclick = exchangeModal;
  page.querySelectorAll(".mood button").forEach(b => b.onclick = () => {
    rollover();
    state.mood = b.dataset.m;
    save(); render();
  });
}
function moodBtn(v, em, label) {
  return '<button data-m="' + v + '"' + (state.mood === v ? ' class="sel"' : "") +
    '><span class="em">' + em + "</span>" + label + "</button>";
}
function fitPlate() {
  const el = document.getElementById("plateName");
  if (!el || !el.clientWidth) return; // невидимый контейнер мерить нельзя
  let size = 34;
  el.style.fontSize = size + "px";
  while (el.scrollWidth > el.clientWidth && size > 12) {
    size -= 2;
    el.style.fontSize = size + "px";
  }
}

/* — задачи — */
function renderTasks() {
  let html = '<h2 class="pagetitle">🔧 Задачи</h2>';
  for (const cat in CATS) {
    const list = state.tasks.filter(t => t.cat === cat);
    if (!list.length) continue;
    const done = list.filter(t => t.done).length;
    html += '<div class="cat' + (ui.open[cat] ? " open" : "") + '" data-cat="' + cat + '">' +
      '<div class="cat-head">' + CATS[cat].emoji + " " + CATS[cat].name +
      '<span class="cnt">' + done + "/" + list.length + '</span><span class="chev">▶</span></div>' +
      '<div class="cat-body">' + list.map(taskRow).join("") + "</div></div>";
  }
  page.innerHTML = html;
  page.querySelectorAll(".cat-head").forEach(h => h.onclick = () => {
    const c = h.parentElement.dataset.cat;
    ui.open[c] = !ui.open[c];
    render();
  });
  page.querySelectorAll(".task").forEach(t => t.onclick = () => toggleTask(t.dataset.id));
}
function taskRow(k) {
  const td = dow();
  const dots = k.week.map((v, i) =>
    "<i class='" + (v ? "on" : "") + (i === td ? " today" : "") + "'></i>").join("");
  return '<div class="task' + (k.done ? " done" : "") + '" data-id="' + k.id + '">' +
    '<div class="chk">' + (k.done ? "✓" : "") + "</div>" +
    '<div class="task-mid"><div class="task-title">' + esc(k.title) + "</div>" +
    '<div class="task-meta"><span class="streak">🔥 ' + k.streak + '</span><span class="dots">' + dots + "</span></div></div>" +
    '<div class="pts">+' + k.pts + " 🔩</div></div>";
}

/* — поведение — */
function renderBeh() {
  const opts = [
    { v: "clean", em: "🏁", t: "Чистый заезд", d: "Держал себя в руках, без грубых слов", val: "+5 🔩" },
    { v: "even",  em: "🚗", t: "Ехал ровно",   d: "Обычный день", val: "+2 🔩" },
    { v: "skid",  em: "🔧", t: "Занесло на повороте", d: "Сорвался — серия обнуляется", val: "0" },
  ];
  page.innerHTML = '<h2 class="pagetitle">🏁 Поведение</h2>' +
    '<div class="card" style="text-align:center"><div class="cardtitle">СЕРИЯ ЧИСТЫХ ЗАЕЗДОВ</div>' +
    '<div style="font-size:30px;font-weight:900">🔥 ' + state.behStreak + '</div>' +
    '<div style="font-size:12px;color:var(--dim);margin-top:4px">дней подряд</div></div>' +
    opts.map(o =>
      '<button class="beh-card' + (state.beh === o.v ? " sel" : "") + '" data-v="' + o.v + '"' +
      (state.beh ? " disabled" : "") + ">" +
      '<span class="em">' + o.em + '</span><span><span class="t">' + o.t + '</span><div class="d">' + o.d + "</div></span>" +
      '<span class="val">' + o.val + "</span></button>").join("") +
    (state.beh ? '<div class="beh-note">Отмечено! Завтра будет новый заезд 🏎</div>'
               : '<div class="beh-note">Отмечай вечером, когда день позади. Один раз в день, честно 🤝</div>');
  page.querySelectorAll(".beh-card").forEach(b => b.onclick = () => pickBehavior(b.dataset.v));
}

/* — награды — */
function renderRewards() {
  page.innerHTML = '<h2 class="pagetitle">🏆 Награды</h2>' +
    '<div class="card" style="text-align:center;font-weight:800">У тебя: <span style="color:var(--acc2)">' + state.bal + " 🔩</span>" +
    (state.pending.length ? '<div style="font-size:13px;color:var(--dim);font-weight:600;margin-top:5px">🎁 ждёт выдачи у папы: ' + state.pending.length + "</div>" : "") + "</div>" +
    (state.rewards.length
      ? state.rewards.slice().sort((a, b) => a.cost - b.cost).map(r => {
          const pct = Math.min(100, Math.round(state.bal / r.cost * 100));
          return '<div class="card reward"><div class="reward-top">' +
            '<div class="reward-title">' + esc(r.title) + '</div><div class="reward-cost">' + r.cost + " 🔩</div></div>" +
            '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
            '<div class="reward-bot"><span class="reward-got">' + (r.got ? "получено: " + r.got + " раз" : "") + "</span>" +
            '<button class="btn small" data-id="' + r.id + '"' + (state.bal < r.cost ? " disabled" : "") + ">Забрать</button></div></div>";
        }).join("")
      : '<div class="card" style="color:var(--dim)">Наград пока нет — попроси папу добавить в родительском режиме.</div>');
  page.querySelectorAll(".reward .btn").forEach(b => b.onclick = () => claimReward(b.dataset.id));
}

/* — родительский режим — */
function renderParent() {
  const taskList = state.tasks.map(k =>
    '<div class="plist-item"><span>' + CATS[k.cat].emoji + '</span><span class="nm">' + esc(k.title) +
    ' <b style="color:var(--acc2)">+' + k.pts + '</b></span><button class="del" data-t="' + k.id + '">✕</button></div>').join("");
  const pendingList = state.pending.length
    ? state.pending.map(p =>
        '<div class="plist-item"><span>🎁</span><span class="nm">' + esc(p.title) +
        ' <span style="color:var(--dim);font-size:12px">' + p.date + '</span></span>' +
        '<button class="btn small ghost" data-p="' + p.id + '">Выдано ✓</button></div>').join("")
    : '<div style="color:var(--dim);font-size:13px;padding:6px 0">Всё выдано 👍</div>';
  const rewardList = state.rewards.map(r =>
    '<div class="plist-item"><span>🏆</span><span class="nm">' + esc(r.title) +
    ' <b style="color:var(--acc2)">' + r.cost + ' 🔩</b></span><button class="del" data-r="' + r.id + '">✕</button></div>').join("");

  page.innerHTML =
    '<h2 class="pagetitle">⚙️ Родительский режим</h2>' +

    '<div class="card"><div class="cardtitle">РЕБЁНОК</div>' +
      '<div class="prow"><input class="inp" id="pName" maxlength="14" placeholder="Имя" value="' + esc(state.name) + '">' +
      '<button class="btn small" id="pNameSave">OK</button></div></div>' +

    '<div class="card"><div class="cardtitle">КУРС ОБМЕНА</div>' +
      '<div class="prow"><span style="flex:none">1 🔩 =</span>' +
      '<input class="inp" id="pRate" type="number" inputmode="decimal" min="0.1" step="0.1" value="' + state.rate + '">' +
      '<span style="flex:none">₽</span><button class="btn small" id="pRateSave">OK</button></div></div>' +

    '<div class="card"><div class="cardtitle">ТАБЛО «БУФЕТ»</div>' +
      '<div class="board"><div class="sum">' + fmt(state.rub) + ' ₽</div>' +
      '<button class="btn small ghost" id="pPayout">Выплачено — обнулить</button></div></div>' +

    '<div class="card"><div class="cardtitle">К ВЫДАЧЕ 🎁</div>' +
      '<div class="plist" style="border-top:none">' + pendingList + "</div></div>" +

    '<div class="card"><div class="switch"><div><b>Жёсткие штрафы</b>' +
      '<div style="font-size:12px;color:var(--dim);margin-top:3px">«Занесло» обнуляет серии всех задач.<br>Заработанные гайки не отнимаются никогда.</div></div>' +
      '<label class="toggle"><input type="checkbox" id="pHard"' + (state.hard ? " checked" : "") + "><span></span></label></div></div>" +

    '<div class="card"><div class="cardtitle">ЗАДАЧИ</div>' +
      '<div class="prow"><select class="inp" id="pTCat" style="flex:none;width:92px">' +
        Object.keys(CATS).map(c => '<option value="' + c + '">' + CATS[c].emoji + "</option>").join("") +
      '</select><input class="inp" id="pTTitle" placeholder="Новая задача" maxlength="40">' +
      '<input class="inp" id="pTPts" type="number" inputmode="numeric" min="1" placeholder="🔩" style="flex:none;width:64px">' +
      '<button class="btn small" id="pTAdd">+</button></div>' +
      '<div class="plist">' + taskList + "</div></div>" +

    '<div class="card"><div class="cardtitle">НАГРАДЫ</div>' +
      '<div class="prow"><input class="inp" id="pRTitle" placeholder="Новая награда" maxlength="40">' +
      '<input class="inp" id="pRCost" type="number" inputmode="numeric" min="1" placeholder="🔩" style="flex:none;width:64px">' +
      '<button class="btn small" id="pRAdd">+</button></div>' +
      '<div class="plist">' + rewardList + "</div></div>" +

    '<div class="card"><div class="cardtitle">PIN-КОД</div>' +
      '<div class="prow"><input class="inp" id="pPin" type="password" inputmode="numeric" maxlength="6" placeholder="Новый PIN (4–6 цифр)">' +
      '<button class="btn small" id="pPinSave">OK</button></div></div>' +

    '<div class="card"><div class="cardtitle">ОПАСНАЯ ЗОНА</div>' +
      '<button class="btn danger" id="pReset" style="width:100%">Сбросить всё</button></div>' +

    '<button class="btn ghost" id="pExit" style="width:100%;margin-bottom:10px">← Выйти из родительского режима</button>';

  const $ = id => document.getElementById(id);

  $("pNameSave").onclick = () => {
    const v = $("pName").value.trim();
    if (v) { state.name = v; save(); flash($("pNameSave")); }
  };
  $("pRateSave").onclick = () => {
    const v = parseFloat($("pRate").value);
    if (v > 0) { state.rate = v; save(); flash($("pRateSave")); }
  };
  $("pPayout").onclick = async () => {
    if (!state.rub) return;
    if (await modalConfirm("Обнулить табло?", "Отметить, что " + fmt(state.rub) + " ₽ выплачены на буфет.", "Обнулить"))
      { state.rub = 0; save(); render(); }
  };
  $("pHard").onchange = e => { state.hard = e.target.checked; save(); };
  page.querySelectorAll("[data-p]").forEach(b => b.onclick = () => {
    state.pending = state.pending.filter(p => p.id !== b.dataset.p);
    save(); render();
  });
  $("pTAdd").onclick = () => {
    const title = $("pTTitle").value.trim(), pts = parseInt($("pTPts").value, 10);
    if (!title || !(pts > 0)) return;
    state.tasks.push({ id: uid(), cat: $("pTCat").value, title, pts, done: false, streak: 0, week: [0,0,0,0,0,0,0] });
    save(); render();
  };
  $("pRAdd").onclick = () => {
    const title = $("pRTitle").value.trim(), cost = parseInt($("pRCost").value, 10);
    if (!title || !(cost > 0)) return;
    state.rewards.push({ id: uid(), title, cost, got: 0 });
    save(); render();
  };
  page.querySelectorAll(".del").forEach(b => b.onclick = async () => {
    if (b.dataset.t) {
      const k = state.tasks.find(x => x.id === b.dataset.t);
      if (await modalConfirm("Удалить задачу?", esc(k.title), "Удалить", true))
        { state.tasks = state.tasks.filter(x => x.id !== b.dataset.t); save(); render(); }
    } else {
      const r = state.rewards.find(x => x.id === b.dataset.r);
      if (await modalConfirm("Удалить награду?", esc(r.title), "Удалить", true))
        { state.rewards = state.rewards.filter(x => x.id !== b.dataset.r); save(); render(); }
    }
  });
  $("pPinSave").onclick = () => {
    const v = $("pPin").value.trim();
    if (/^\d{4,6}$/.test(v)) { state.pin = v; $("pPin").value = ""; save(); flash($("pPinSave")); }
    else modalAlert("PIN не подходит", "Нужно 4–6 цифр.");
  };
  $("pReset").onclick = async () => {
    if (await modalConfirm("Сбросить всё?", "Все баллы, серии, задачи и награды будут удалены безвозвратно.", "Сбросить", true)) {
      const keepName = state.name;
      state = freshState();
      state.name = keepName;
      save(); render();
    }
  };
  $("pExit").onclick = () => { ui.parent = false; render(); };
}
function flash(btn) {
  const t = btn.textContent;
  btn.textContent = "✓";
  setTimeout(() => { btn.textContent = t; }, 900);
}

/* ================= НАВИГАЦИЯ И СТАРТ ================= */

document.querySelectorAll("#nav button").forEach(b => b.onclick = () => {
  ui.parent = false;
  ui.tab = b.dataset.tab;
  rollover(); save();
  render();
});

document.getElementById("gearBtn").onclick = async () => {
  if (ui.parent) { ui.parent = false; render(); return; }
  if (await askPin()) { ui.parent = true; render(); }
};

window.addEventListener("resize", fitPlate);
document.addEventListener("visibilitychange", () => { if (!document.hidden) fitPlate(); });

/* проверка полуночи каждые 30 секунд */
setInterval(() => {
  if (rollover()) { save(); render(); }
}, 30000);

(async function start() {
  rollover(); save();
  render();
  if (!state.name) {
    const n = await askName();
    state.name = n;
    save(); render();
    confetti();
  }
})();
</script>
</body>
</html>
